name: Mobile CI

on:
  push:
    paths:
      - "apps/mobile/**"
      - "apps/backend/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/backend/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pemeriksaan backend berdiri sendiri: tipe, lint, batas baris, dan tes.
  # Memakai database :memory:, jadi tidak menyentuh Turso atau database dev.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: npm ci
      - name: Typecheck, lint, line limit, and tests
        run: npm run check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js for backend fixtures
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: npm ci
        working-directory: apps/backend
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
      - name: Install mobile dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze mobile source
        run: flutter analyze
      - name: Test mobile and backend integration
        run: flutter test --concurrency=1
